<svg width="1440" height="1024" viewBox="0 0 1440 1024" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="title desc">
  <title id="title">JOD GET dashboard visual mockup</title>
  <desc id="desc">A desktop web app mockup for a job search tracker with sidebar navigation, dashboard stats, recent job cards, and application progress.</desc>
  <rect width="1440" height="1024" fill="#F8FAFC"/>

  <rect x="40" y="40" width="1360" height="944" rx="32" fill="#FFFFFF" stroke="#E2E8F0"/>

  <rect x="40" y="40" width="264" height="944" rx="32" fill="#0F172A"/>
  <rect x="264" y="40" width="40" height="944" fill="#0F172A"/>
  <circle cx="92" cy="104" r="26" fill="#2563EB"/>
  <path d="M80 105.5L90.5 116L106 92" stroke="white" stroke-width="6" stroke-linecap="round" stroke-linejoin="round"/>
  <text x="132" y="112" fill="white" font-family="Inter, Arial, sans-serif" font-size="28" font-weight="800">JOD GET</text>
  <text x="72" y="163" fill="#94A3B8" font-family="Inter, Arial, sans-serif" font-size="13" font-weight="600" letter-spacing="1.5">JOB SEARCH</text>

  <g font-family="Inter, Arial, sans-serif" font-size="16" font-weight="600">
