    <text x="112" y="362" fill="#CBD5E1">Applications</text>
    <circle cx="88" cy="356" r="6" fill="#64748B"/>
    <text x="112" y="424" fill="#CBD5E1">Interviews</text>
    <circle cx="88" cy="418" r="6" fill="#64748B"/>
    <text x="112" y="486" fill="#CBD5E1">Resume</text>
    <circle cx="88" cy="480" r="6" fill="#64748B"/>
    <text x="112" y="548" fill="#CBD5E1">Settings</text>
    <circle cx="88" cy="542" r="6" fill="#64748B"/>
  </g>

  <rect x="72" y="824" width="200" height="112" rx="20" fill="#1E293B"/>
