    <rect x="884" y="620" width="44" height="34" rx="10" fill="#FFFFFF" stroke="#E2E8F0"/>
    <path d="M900 637H916" stroke="#2563EB" stroke-width="3" stroke-linecap="round"/>

    <rect x="384" y="736" width="568" height="118" rx="18" fill="#F8FAFC" stroke="#E2E8F0"/>
    <text x="412" y="776" fill="#0F172A" font-size="18" font-weight="800">Warehouse Associate</text>
    <text x="412" y="806" fill="#64748B" font-size="14">Northline Logistics • Atlanta, GA • $18 - $24/hr</text>
    <rect x="790" y="764" width="86" height="30" rx="15" fill="#FEF3C7"/>
    <text x="806" y="785" fill="#B45309" font-size="12" font-weight="800">Interview</text>
    <rect x="884" y="762" width="44" height="34" rx="10" fill="#FFFFFF" stroke="#E2E8F0"/>
    <path d="M900 779H916" stroke="#2563EB" stroke-width="3" stroke-linecap="round"/>
  </g>

  <rect x="1016" y="360" width="324" height="266" rx="26" fill="#FFFFFF" stroke="#E2E8F0"/>
  <text x="1048" y="414" fill="#0F172A" font-family="Inter, Arial, sans-serif" font-size="22" font-weight="800">Application Progress</text>
  <circle cx="1178" cy="508" r="74" stroke="#E2E8F0" stroke-width="22"/>
  <path d="M1178 434C1218.9 434 1252 467.1 1252 508" stroke="#2563EB" stroke-width="22" stroke-linecap="round"/>
  <path d="M1252 508C1252 539.8 1231.7 566.8 1203.4 577" stroke="#22C55E" stroke-width="22" stroke-linecap="round"/>
