  <text x="96" y="886" fill="#CBD5E1" font-family="Inter, Arial, sans-serif" font-size="13">Add the next job and</text>
  <text x="96" y="906" fill="#CBD5E1" font-family="Inter, Arial, sans-serif" font-size="13">keep momentum.</text>

  <text x="352" y="108" fill="#0F172A" font-family="Inter, Arial, sans-serif" font-size="34" font-weight="800">Dashboard</text>
  <text x="352" y="139" fill="#64748B" font-family="Inter, Arial, sans-serif" font-size="16">Track saved jobs, applications, interviews, and offers in one place.</text>

  <rect x="884" y="76" width="292" height="48" rx="14" fill="#F8FAFC" stroke="#E2E8F0"/>
  <circle cx="912" cy="100" r="8" stroke="#94A3B8" stroke-width="2"/>
